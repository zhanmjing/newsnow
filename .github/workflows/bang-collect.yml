name: bang-collect

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Collect and ingest
        env:
          BANG_BASE_URL: ${{ vars.BANG_BASE_URL || 'https://newsnow-cyb.pages.dev' }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: pnpm exec tsx scripts/bang-collect.ts
